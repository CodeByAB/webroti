# Weekly dependency audit, so a new advisory against an unchanged
# package-lock.json shows up without a push. Only the dependencies that
# reach the deployed site (none today — everything is a devDependency, and
# public/vendor/ is checked by hand on upgrade) fail on moderate; the dev
# tooling fails on high.
name: Audit

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Dev tooling
        run: npm audit --audit-level=high
