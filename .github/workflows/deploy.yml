# Deploys main to Cloudflare Pages: verify, apply new D1 migrations, upload
# public/ and functions/. Needs the repository secrets CLOUDFLARE_API_TOKEN
# (permissions: Account › Cloudflare Pages: Edit, Account › D1: Edit) and
# CLOUDFLARE_ACCOUNT_ID — see docs/deploy.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # never stop a deploy halfway through a migration

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://webroti.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci
        env:
          LEFTHOOK: '0'

      - name: Lint, typecheck and tests
        run: npm run check

      # Migrations must be backwards compatible with the code that is live,
      # because they run before the new code is uploaded.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: d1 migrations apply webroti --remote

      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: pages deploy --project-name=webroti --branch=main --commit-hash=${{ github.sha }}
